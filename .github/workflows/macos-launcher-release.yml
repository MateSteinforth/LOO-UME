name: Publish Mac launcher

on:
  push:
    branches:
      - main
    tags:
      - "mac-launcher-v*"
  workflow_dispatch:

concurrency:
  group: mac-launcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-macos-launcher:
    name: Package self-installing Mac launcher
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate launcher sources
        run: |
          /bin/sh -n macos/launcher/Contents/MacOS/LOO-UME
          /bin/sh -n "macos/Uninstall LOO UME.command"
          /bin/sh -n scripts/looume.sh
          /usr/bin/plutil -lint macos/launcher/Contents/Info.plist
          test -x macos/launcher/Contents/MacOS/LOO-UME
          test -x "macos/Uninstall LOO UME.command"
          test -x scripts/looume.sh

      - name: Build the native icon and application bundle
        run: |
          set -eu
          bundle="$RUNNER_TEMP/LOO UME.app"
          icon_source_directory="$RUNNER_TEMP/icon-source"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$icon_source_directory" "$iconset"
          /usr/bin/qlmanage -t -s 1024 -o "$icon_source_directory" macos/AppIcon.svg >/dev/null
          icon_source="$icon_source_directory/AppIcon.svg.png"
          test -s "$icon_source"
          make_icon() {
            size=$1
            name=$2
            /usr/bin/sips -z "$size" "$size" "$icon_source" --out "$iconset/$name" >/dev/null
          }
          make_icon 16 icon_16x16.png
          make_icon 32 icon_16x16@2x.png
          make_icon 32 icon_32x32.png
          make_icon 64 icon_32x32@2x.png
          make_icon 128 icon_128x128.png
          make_icon 256 icon_128x128@2x.png
          make_icon 256 icon_256x256.png
          make_icon 512 icon_256x256@2x.png
          make_icon 512 icon_512x512.png
          make_icon 1024 icon_512x512@2x.png
          /usr/bin/iconutil -c icns "$iconset" -o "$RUNNER_TEMP/AppIcon.icns"
          /usr/bin/ditto macos/launcher "$bundle"
          mkdir -p "$bundle/Contents/Resources"
          cp "$RUNNER_TEMP/AppIcon.icns" "$bundle/Contents/Resources/AppIcon.icns"
          chmod 755 "$bundle/Contents/MacOS/LOO-UME"
          if [ "${GITHUB_REF#refs/tags/mac-launcher-v}" != "$GITHUB_REF" ]; then
            launcher_version=${GITHUB_REF_NAME#mac-launcher-v}
          else
            launcher_version=0.1.$GITHUB_RUN_NUMBER
          fi
          if ! printf '%s\n' "$launcher_version" | /usr/bin/grep -Eq \
              '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid launcher version: $launcher_version" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString $launcher_version" \
            "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$bundle/Contents/Info.plist"
          /usr/bin/codesign --force --deep --sign - "$bundle"
          /usr/bin/codesign --verify --deep --strict "$bundle"
          package_directory="$RUNNER_TEMP/LOO-UME-Mac-Launcher"
          mkdir -p "$package_directory"
          /usr/bin/ditto "$bundle" "$package_directory/LOO UME.app"
          /usr/bin/ditto "macos/Uninstall LOO UME.command" \
            "$package_directory/Uninstall LOO UME.command"
          chmod 755 "$package_directory/Uninstall LOO UME.command"
          mkdir -p build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$package_directory" build/LOO-UME-Mac-Launcher.zip
          /usr/bin/shasum -a 256 build/LOO-UME-Mac-Launcher.zip \
            > build/LOO-UME-Mac-Launcher.zip.sha256

      - name: Upload the review artifact
        uses: actions/upload-artifact@v7
        with:
          name: loo-ume-mac-launcher
          path: |
            build/LOO-UME-Mac-Launcher.zip
            build/LOO-UME-Mac-Launcher.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified launcher release
    if: github.event_name == 'push'
    needs: package-macos-launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require the packaged commit on canonical main
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            test "$(git rev-parse HEAD)" = \
              "$(git rev-parse refs/remotes/origin/main)"
          else
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi

      - name: Download the verified launcher artifact
        uses: actions/download-artifact@v7
        with:
          name: loo-ume-mac-launcher
          path: build

      - name: Verify and publish the launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          /usr/bin/sha256sum --check build/LOO-UME-Mac-Launcher.zip.sha256
          if [ "${GITHUB_REF#refs/tags/mac-launcher-v}" != "$GITHUB_REF" ]; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag=mac-launcher-v0.1.$GITHUB_RUN_NUMBER
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            existing_target=$(gh release view "$release_tag" \
              --json targetCommitish --jq .targetCommitish)
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "Release $release_tag belongs to $existing_target, not $GITHUB_SHA." >&2
              exit 1
            fi
            gh release upload "$release_tag" \
              build/LOO-UME-Mac-Launcher.zip \
              build/LOO-UME-Mac-Launcher.zip.sha256 \
              --clobber
          else
            gh release create "$release_tag" \
              build/LOO-UME-Mac-Launcher.zip \
              build/LOO-UME-Mac-Launcher.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "LOO/UME Mac Launcher $release_tag" \
              --generate-notes \
              --latest
          fi
