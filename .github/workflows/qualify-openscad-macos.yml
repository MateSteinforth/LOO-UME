name: Qualify macOS OpenSCAD artifact

on:
  push:
    branches: [codex/install-013-managed-openscad-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify ${{ matrix.architecture }} snapshot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    steps:
      - name: Confirm native runner
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          if /usr/sbin/sysctl -in sysctl.proc_translated 2>/dev/null | grep -qx 1; then
            echo "The qualification process is running through Rosetta."
            exit 1
          fi

      - name: Download and qualify universal snapshot
        id: qualify
        shell: bash
        env:
          OPENSCAD_DMG_URL: https://files.openscad.org/snapshots/OpenSCAD-2026.06.12.dmg
          OPENSCAD_DMG_SHA256: 555be2ed313e67657b3d8ba3e1de0acd6141b982fd458776c52d3eda748f57c4
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/openscad-qualification.txt"
          touch "$evidence"
          exec > >(tee -a "$evidence" "$GITHUB_STEP_SUMMARY") 2>&1
          failed=0
          failed_labels=""
          check() {
            label="$1"
            shift
            echo
            echo "## $label"
            output=$("$@" 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              annotation=$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-500)
              echo "::error title=$label::Command failed with status $status: $annotation"
              label_id=$(printf '%s' "$label" | tr '[:upper:] ' '[:lower:]_')
              failed_labels="${failed_labels}${failed_labels:+-}${label_id}"
              failed=1
            fi
          }

          dmg="$RUNNER_TEMP/OpenSCAD-2026.06.12.dmg"
          mount_point="$RUNNER_TEMP/openscad-qualification-mount"
          probe_scad="$RUNNER_TEMP/probe.scad"
          probe_stl="$RUNNER_TEMP/probe.stl"
          mkdir -p "$mount_point"
          cleanup() { hdiutil detach "$mount_point" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          check "Download" curl --fail --location --silent --show-error "$OPENSCAD_DMG_URL" --output "$dmg"
          check "SHA-256" shasum -a 256 --check <(printf '%s  %s\n' "$OPENSCAD_DMG_SHA256" "$dmg")
          actual_size=$(stat -f %z "$dmg" 2>/dev/null || true)
          echo "## Size"
          echo "$actual_size bytes"
          if [ "$actual_size" != "64447344" ]; then
            failed_labels="${failed_labels}${failed_labels:+-}size"
            echo "::error title=Size::Expected 64447344 bytes; got $actual_size."
            failed=1
          fi

          check "Attach DMG" hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_point" "$dmg"
          app="$mount_point/OpenSCAD.app"
          executable="$app/Contents/MacOS/OpenSCAD"
          if [ ! -x "$executable" ]; then
            failed_labels="${failed_labels}${failed_labels:+-}executable"
            echo "::error title=Executable::The expected OpenSCAD executable is absent."
            failed=1
          else
            check "Mach-O architectures" lipo -archs "$executable"
            check "Universal slices" lipo -verify_arch arm64 x86_64 "$executable"

            echo "## Native version"
            version_output=$(/usr/bin/arch "-${{ matrix.architecture }}" "$executable" --version 2>&1)
            version_status=$?
            printf '%s\n' "$version_output"
            printf '%s\n' "$version_output" >"$RUNNER_TEMP/openscad-version.txt"
            if [ "$version_status" -ne 0 ] || ! printf '%s\n' "$version_output" | grep -Eq '^OpenSCAD version 2026\.06\.12([[:space:]]|$)'; then
              echo "::error title=Native version::Expected OpenSCAD version 2026.06.12."
              failed_labels="${failed_labels}${failed_labels:+-}native_version"
              failed=1
            fi

            printf '%s\n' 'cube([1,1,1]);' >"$probe_scad"
            check "Native STL render" /usr/bin/arch "-${{ matrix.architecture }}" "$executable" --hardwarnings -o "$probe_stl" "$probe_scad"
            if [ ! -s "$probe_stl" ]; then
              echo "::error title=Native STL render::The probe STL is absent or empty."
              failed_labels="${failed_labels}${failed_labels:+-}native_stl"
              failed=1
            fi

            check "Code signature" codesign --verify --deep --strict --verbose=4 "$app"
            check "Signature identity" codesign -dv --verbose=4 "$app"
            check "Gatekeeper assessment" spctl --assess --type execute --verbose=4 "$app"
            check "Notarization ticket" xcrun stapler validate "$app"
            check "Bundle metadata" plutil -p "$app/Contents/Info.plist"
            check "OpenSCAD build info" /usr/bin/arch "-${{ matrix.architecture }}" "$executable" --info
            echo "## Commit candidates"
            strings "$executable" | grep -E '[0-9a-f]{40}' | sort -u | head -n 50 || true
          fi

          cleanup
          trap - EXIT
          printf 'failed_labels=%s\n' "${failed_labels:-none}" >>"$GITHUB_OUTPUT"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openscad-macos-${{ matrix.architecture }}-${{ steps.qualify.outputs.failed_labels }}
          path: |
            ${{ runner.temp }}/openscad-qualification.txt
            ${{ runner.temp }}/openscad-version.txt
            ${{ runner.temp }}/probe.stl
          if-no-files-found: warn
          retention-days: 30
