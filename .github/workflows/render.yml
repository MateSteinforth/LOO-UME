name: Verify Manifold application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run all geometry and browser tests, including deferred P2 failures
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  fast-build:
    name: Fast TypeScript and production build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check changed formatting and source rules
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
        run: |
          npm run format:check
          npm run lint:fast -- --all
          npm run lint:typed -- --all
      - name: Run fast behavior checks
        run: npm run test:fast
      - name: Verify the checked-in runtime and production build
        run: npm run build:desktop

  mapping-artifact-parity:
    name: Mapping artifacts (${{ matrix.runner }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Verify logical order and address artifacts
        run: |
          npm run test:unit -- tests/logical-led-order.test.ts tests/hardware-mapping.test.ts tests/pose-first-equivalence.test.ts
          npm run generate:mapping
          git diff --exit-code -- wled/diagnostic

  stage-zero-bootstrap-linux:
    name: Stage-zero bootstrap (Linux x86-64)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and extract the approved Go builder
        run: |
          archive="$RUNNER_TEMP/go1.26.6.linux-amd64.tar.gz"
          compiler_root="$RUNNER_TEMP/go1.26.6"
          curl --fail --silent --show-error --location --output "$archive" https://go.dev/dl/go1.26.6.linux-amd64.tar.gz
          test "$(stat -c %s "$archive")" = "66890545"
          echo "708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89  $archive" | sha256sum --check -
          mkdir -p "$compiler_root"
          tar -xzf "$archive" -C "$compiler_root" --strip-components=1
          test "$("$compiler_root/bin/go" version)" = "go version go1.26.6 linux/amd64"
          echo "GO_BOOTSTRAP=$compiler_root/bin/go" >> "$GITHUB_ENV"
      - name: Test stage-zero source
        working-directory: toolchains/bootstrap/src
        run: $GO_BOOTSTRAP test ./...
      - name: Rebuild and verify all committed executables
        run: sh scripts/build-bootstrap.sh --check
      - name: Run the committed native executable
        run: sh scripts/verify-bootstrap-binaries.sh linux-x64

  stage-zero-bootstrap-macos:
    name: Stage-zero and clean setup (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm native target
        run: test "$(/usr/bin/uname -m)" = "${{ matrix.architecture }}"
      - name: Verify and run the committed native executable
        run: sh scripts/verify-bootstrap-binaries.sh "${{ matrix.target }}"
      - name: Bootstrap the production desktop without global Node or npm
        run: env PATH=/usr/bin:/bin ./bootstrap.sh setup

  clean-checkout:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap the production desktop without global Node or npm
        run: env PATH=/usr/bin:/bin ./bootstrap.sh setup
      - name: Run fast and host tests with the managed runtime
        run: env PATH=/usr/bin:/bin ./bootstrap.sh npm test -- --project fast --project host
      - name: Run full geometry regression when requested
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: env PATH=/usr/bin:/bin ./bootstrap.sh npm run test:geometry

  manifold-panel-parts:
    name: Manifold panel-outline parts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Generate and inspect prism parts
        run: |
          npx tsx scripts/generate-panel-boundary-parts.ts \
            --sculpture sculptures/panel-outline-prism/sculpture.json \
            --output build/ci-manifold-prism
          test -s build/ci-manifold-prism/mechanics/boundary.stl
          test -s build/ci-manifold-prism/mechanics/parts/part-001.stl
          test -s build/ci-manifold-prism/mechanics/parts/part-002.stl
      - name: Keep failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: manifold-panel-parts-failure
          path: build/ci-manifold-prism/
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: Browser smoke (Chromium)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Chromium and host libraries
        run: npm run setup:browser -- --with-deps
      - name: Run real browser authoring smoke test
        if: github.event_name != 'workflow_dispatch' || !inputs.full_regression
        run: >-
          npm run test:browser --
          tests/browser/generate-parts.spec.ts
          tests/browser/mechanics-free-authoring.spec.ts
          tests/browser/wiring-rotation-gate.spec.ts
      - name: Run full browser regression when requested
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
