name: Render OpenSCAD parts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - triangle
          - pentagon_u
          - middle_panel_connector

    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad xvfb xauth

      - name: Render STL
        run: |
          mkdir -p build
          openscad --hardwarnings \
            -o "build/${{ matrix.part }}.stl" \
            "parts/${{ matrix.part }}.scad"

      - name: Render preview
        run: |
          xvfb-run -a openscad \
            --imgsize=1200,900 \
            --viewall \
            --autocenter \
            --render \
            -o "build/${{ matrix.part }}.png" \
            "parts/${{ matrix.part }}.scad"

      - name: Upload printable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.part }}
          path: |
            build/${{ matrix.part }}.stl
            build/${{ matrix.part }}.png
          if-no-files-found: error
          retention-days: 30

  cad-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad xvfb xauth

      - name: Generate and verify JSON-driven CAD
        run: npm run verify:cad

      - name: Upload generated CAD contract
        uses: actions/upload-artifact@v7
        with:
          name: generated-cad-contract
          path: |
            build/generated/
            build/verify-cad/triangle-generated.stl
            build/verify-cad/triangle-assembly.png
          if-no-files-found: error
          retention-days: 30

  publish-latest-prototype:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [render, cad-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download rendered parts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish rolling prototype release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-prototype
          RELEASE_TITLE: Latest Prototype
          RELEASE_NOTES: |
            This rolling release contains the current printable models from ${{ github.sha }}.

            Git history preserves every source revision. The assets here are replaced only after all OpenSCAD renders succeed.

            ## Triangle
            [Open triangle preview](https://github.com/${{ github.repository }}/blob/generated-previews/triangle.png)

            [Download triangle STL](https://github.com/${{ github.repository }}/releases/download/latest-prototype/triangle.stl)

            ## Pentagon U-frame
            [Open pentagon U-frame preview](https://github.com/${{ github.repository }}/blob/generated-previews/pentagon_u.png)

            [Download pentagon U-frame STL](https://github.com/${{ github.repository }}/releases/download/latest-prototype/pentagon_u.stl)

            ## Middle-panel connector
            [Open middle-panel connector preview](https://github.com/${{ github.repository }}/blob/generated-previews/middle_panel_connector.png)

            [Download middle-panel connector STL](https://github.com/${{ github.repository }}/releases/download/latest-prototype/middle_panel_connector.stl)
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          gh release upload "$RELEASE_TAG" \
            release/triangle.stl \
            release/triangle.png \
            release/pentagon_u.stl \
            release/pentagon_u.png \
            release/middle_panel_connector.stl \
            release/middle_panel_connector.png \
            --clobber

      - name: Publish mobile preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          preview_dir="$RUNNER_TEMP/generated-previews"
          mkdir -p "$preview_dir"
          cp release/*.png "$preview_dir/"
          gh auth setup-git

          git -C "$preview_dir" init --initial-branch=generated-previews
          git -C "$preview_dir" config user.name github-actions
          git -C "$preview_dir" config user.email github-actions@github.com
          git -C "$preview_dir" add .
          git -C "$preview_dir" commit -m "Preview ${GITHUB_SHA}"
          git -C "$preview_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$preview_dir" push --force origin generated-previews
