name: Build Electron application for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "tests/**"
    tags:
      - "electron-v*"

concurrency:
  group: electron-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package Electron DMG and ZIP
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require release tags on canonical main
        if: startsWith(github.ref, 'refs/tags/electron-v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set the application version
        run: |
          if [ "${GITHUB_REF#refs/tags/electron-v}" != "$GITHUB_REF" ]; then
            application_version=${GITHUB_REF_NAME#electron-v}
          else
            application_version=0.1.$GITHUB_RUN_NUMBER
          fi
          printf '%s\n' "$application_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          npm version "$application_version" --no-git-tag-version

      - name: Require signing and notarization for a release tag
        if: startsWith(github.ref, 'refs/tags/electron-v')
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build the editor and Mac icon
        run: |
          npm run build:electron
          npm run build:electron-mac-icon

      - name: Stage the verified ESP32 image
        run: |
          mkdir -p build/firmware
          curl --fail --location --silent --show-error \
            https://github.com/MateSteinforth/LOO-UME/releases/download/esp32-firmware-improv-v1/wled-orbital-esp32dev-full-flash.bin \
            --output build/firmware/wled-orbital-esp32dev-full-flash.bin
          node scripts/verify-packaged-firmware.mjs \
            firmware/build-receipt.json \
            build/firmware/wled-orbital-esp32dev-full-flash.bin

      - name: Package a review application
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --universal --publish never --config.mac.notarize=false

      - name: Package the signed and notarized release
        if: startsWith(github.ref, 'refs/tags/electron-v')
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --universal --publish never

      - name: Create the free update notice
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          application_version=$(node -p "require('./package.json').version")
          npx tsx scripts/create-electron-unsigned-update.ts \
            release "$application_version" "$GITHUB_SHA"

      - name: Verify package inventory
        run: |
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -s "release/mac-universal/LOO UME.app/Contents/Resources/app/build/firmware/wled-orbital-esp32dev-full-flash.bin"
          node scripts/verify-packaged-firmware.mjs \
            "release/mac-universal/LOO UME.app/Contents/Resources/app/firmware/build-receipt.json" \
            "release/mac-universal/LOO UME.app/Contents/Resources/app/build/firmware/wled-orbital-esp32dev-full-flash.bin"
          test -s release/latest-mac.yml
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            test -s release/unsigned-update.json
          fi
          if [ -f release/unsigned-update.json ]; then
            shasum -a 256 release/*.dmg release/*.zip \
              release/unsigned-update.json > release/SHA256SUMS
          else
            shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS
          fi

      - name: Upload review artifacts
        uses: actions/upload-artifact@v7
        with:
          name: loo-ume-electron-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/unsigned-update.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-unsigned:
    name: Refresh the default unsigned Mac download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: loo-ume-electron-macos
          path: release

      - name: Publish the stable unsigned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum --check release/SHA256SUMS
          release_tag=electron-macos-unsigned
          release_notes="Unsigned universal Mac build from canonical main at $GITHUB_SHA. Right-click Open is required once. Installed free builds can notify the operator and open this DMG; replacement remains manual."
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              release/LOO-UME-Electron-universal.dmg \
              release/LOO-UME-Electron-universal.zip \
              release/unsigned-update.json \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LOO/UME for Mac — unsigned" \
              --notes "$release_notes" \
              --prerelease
          else
            gh release create "$release_tag" \
              release/LOO-UME-Electron-universal.dmg \
              release/LOO-UME-Electron-universal.zip \
              release/unsigned-update.json \
              release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LOO/UME for Mac — unsigned" \
              --notes "$release_notes" \
              --prerelease \
              --latest=false
          fi
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/LOO-UME-Electron-universal.dmg"
          printf '### Default unsigned Mac download\n\n[%s](%s)\n' \
            'Download LOO-UME-Electron-universal.dmg' "$download_url" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish signed Electron release
    if: startsWith(github.ref, 'refs/tags/electron-v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: loo-ume-electron-macos
          path: release

      - name: Publish the verified update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check release/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LOO/UME Electron ${GITHUB_REF_NAME#electron-v}" \
            --generate-notes \
            --latest

  publish-review:
    name: Publish direct Electron review download
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: loo-ume-electron-macos
          path: release

      - name: Publish the unsigned review package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check release/SHA256SUMS
          release_tag=electron-review-$GITHUB_RUN_NUMBER
          gh release create "$release_tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LOO/UME Electron review $GITHUB_RUN_NUMBER" \
            --notes "Unsigned review build from $GITHUB_REF_NAME at $GITHUB_SHA. This is not an update feed." \
            --prerelease
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/LOO-UME-Electron-universal.dmg"
          printf '### Direct Electron review download\n\n[%s](%s)\n' \
            'Download LOO-UME-Electron-universal.dmg' "$download_url" \
            >> "$GITHUB_STEP_SUMMARY"
